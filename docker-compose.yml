name: email

x-queue-environment: &queue-environment
  NODE_ENV: development
  NODE_OPTIONS: "--experimental-loader=@opentelemetry/instrumentation/hook.mjs"
  OTEL_SERVICE_NAME: email-worker
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_BSP_SCHEDULE_DELAY: 1000
  RABBITMQ_URL: amqp://email:email@rabbitmq:5672
  RABBITMQ_QUEUE: email
  RABBITMQ_PREFETCH: 5
  # Dev mail sink: every message sent by the worker lands in Mailpit.
  emailHost: mailpit
  emailPort: 1025
  emailSecure: "false"
  emailUser: dev
  emailPassword: dev
  emailFrom: no-reply@email.local
  emailFromName: Email Service

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      # Dev-only credentials. The app connects with these same values.
      RABBITMQ_DEFAULT_USER: email
      RABBITMQ_DEFAULT_PASS: email
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    # Ephemeral broker state: keep it in RAM instead of using Docker's
    # built-in anonymous volume for /var/lib/rabbitmq.
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      # Accept any SMTP credentials so the app can authenticate over plain SMTP.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI: http://localhost:8025

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI: http://localhost:16686

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  queue:
    build:
      context: .
      target: production
    image: email-queue:local
    restart: unless-stopped
    command: ["dist/cmd/queue/main.js"]
    environment:
      <<: *queue-environment
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      otel-collector:
        condition: service_started
